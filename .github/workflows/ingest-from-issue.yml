name: Ingest from Issue
on:
  issues:
    types: [labeled]

jobs:
  ingest:
    if: github.event.label.name == 'ingest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: issue-capture-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # GitHub expression equality ignores case. Check the exact label before
      # checking out or publishing anything.
      - id: label
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          if [[ "$LABEL" == ingest ]]; then echo 'capture=true' >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.label.outputs.capture == 'true'

      - name: Publish issue capture
        if: steps.label.outputs.capture == 'true'
        id: publish
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "refs/heads/$BRANCH"
            git switch --detach FETCH_HEAD
            capture=$(python3 scripts/capture_issue.py)
            if git cat-file -e "HEAD:$capture" 2>/dev/null; then
              git diff --quiet HEAD -- "$capture"
            else
              git add -- "$capture"
              git commit --only -m "Capture issue #$ISSUE_NUMBER" -- "$capture"
              if ! git push origin "HEAD:refs/heads/$BRANCH"; then
                sleep "$attempt"
                continue
              fi
            fi
            echo "filename=$capture" >> "$GITHUB_OUTPUT"
            exit 0
          done
          exit 1

      - name: Confirm capture and close issue
        if: steps.label.outputs.capture == 'true'
        uses: actions/github-script@v7
        env:
          FILENAME: ${{ steps.publish.outputs.filename }}
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number }
            const body = `Source captured to \`${process.env.FILENAME}\`. The wiki watcher processes pending captures.`
            const comments = github.paginate.iterator(github.rest.issues.listComments, { ...issue, per_page: 100 })
            let confirmed = false
            for await (const { data } of comments) {
              if (data.some(c => c.user?.login === 'github-actions[bot]' && c.body === body)) {
                confirmed = true
                break
              }
            }
            if (!confirmed) await github.rest.issues.createComment({ ...issue, body })
            await github.rest.issues.update({ ...issue, state: 'closed' })
