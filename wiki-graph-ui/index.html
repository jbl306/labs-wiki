<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>labs-wiki graph</title>
<link rel="stylesheet" href="styles.css?v=__BUILD_ID__" />
</head>
<body>
<button id="sidebar-toggle" class="icon-btn" aria-label="Search and graph controls" aria-controls="sidebar" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 6 6" stroke="currentColor" stroke-width="2"/></svg>
  Search
</button>
<div id="sidebar-backdrop" hidden></div>
<aside id="sidebar" aria-label="Graph controls">
  <header>
    <h1>labs-wiki graph</h1>
    <div id="stats" class="muted">loading…</div>
    <button id="sidebar-close" class="icon-btn sidebar-close" aria-label="Close controls">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3z"/></svg>
    </button>
  </header>

  <section>
    <label for="search">Search pages</label>
    <input id="search" type="search" placeholder="Title or tag" autocomplete="off" />
    <div id="search-meta" role="status" class="muted"></div>
    <ul id="search-results" class="result-list" aria-label="Matching pages" hidden></ul>
  </section>

  <section>
    <label for="ask-graph">Ask the graph</label>
    <input id="ask-graph" type="search" placeholder="Ask a question and press Enter" autocomplete="off" />
    <div id="ask-results" class="hidden">
      <div class="muted" id="ask-meta" role="status"></div>
      <ol id="ask-results-list" class="result-list" aria-label="Ask results"></ol>
    </div>
    <button id="ask-graph-clear" class="secondary hidden" type="button">Clear answer</button>
  </section>

  <details id="advanced-controls">
    <summary>Filters and display</summary>
    <div class="filter-controls">
      <section><label for="type-filter">Type</label><select id="type-filter"><option value="">All types</option></select></section>
      <section><label for="community-filter">Community</label><select id="community-filter"><option value="">All communities</option></select></section>
      <section><label for="tier-filter">Tier</label><select id="tier-filter"><option value="">All tiers</option></select></section>
      <section><label for="checkpoint-class-filter">Checkpoint class</label><select id="checkpoint-class-filter"><option value="">All classes</option></select></section>
      <label><input type="checkbox" id="stale-only-toggle" /> Stale only (unverified or over 90 days)</label>
      <label><input type="checkbox" id="archive-toggle" /> Include archived pages</label>
      <label><input type="checkbox" id="surprises-toggle" /> Highlight cross-community edges</label>
      <button id="clear-filters" class="secondary" type="button">Clear filters</button>
    </div>
  </details>

  <section id="checkpoint-detail" class="hidden">
    <h3>Checkpoint disagreement</h3>
    <div id="checkpoint-detail-body" class="muted">Click a ringed node to inspect.</div>
  </section>

  <section id="legend" aria-label="Graph legend"></section>

  <footer>
    <button id="rebuild-btn" class="secondary">Reload graph</button>
    <div class="muted" id="build-time"></div>
    <div class="muted" id="connection-state">connecting…</div>
  </footer>
</aside>

<!-- Node detail panel lives at the body root, not inside <aside>. The
     sidebar uses transform: translateX() on mobile, which creates a
     containing block for any descendant position:fixed and would push
     the panel off-screen with the sidebar. -->
<section id="node-panel" aria-labelledby="node-title" class="hidden">
  <div class="node-panel-head">
    <div class="node-panel-copy">
      <h2 id="node-title" tabindex="-1"></h2>
      <div class="muted" id="node-meta"></div>
    </div>
    <button id="node-panel-close" class="icon-btn node-panel-close" aria-label="Close node details">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3z"/></svg>
    </button>
  </div>
  <p id="node-summary"></p>
  <div id="node-content" class="node-content"></div>
  <h3>Neighbors</h3>
  <ul id="node-neighbors" class="result-list"></ul>
</section>

<main id="canvas-host">
  <canvas id="graph"></canvas>
  <div id="graph-cosmos" hidden></div>
  <div id="view-controls" aria-label="Graph view controls">
    <div id="zoom-level" class="view-pill">35%</div>
    <button id="zoom-in" class="icon-btn" aria-label="Zoom in">+</button>
    <button id="zoom-out" class="icon-btn" aria-label="Zoom out">−</button>
    <button id="zoom-fit" class="icon-btn view-fit-btn" aria-label="Fit graph to viewport">Fit</button>
    <button id="path-mode-toggle" class="icon-btn view-fit-btn" aria-label="Toggle path mode" aria-pressed="false">Path</button>
    <button id="checkpoint-health-toggle" class="icon-btn view-fit-btn" aria-label="Toggle checkpoint health view" aria-pressed="false">Health</button>
  </div>
  <div id="path-panel" class="hidden" aria-live="polite">
    <div class="path-panel-head">
      <strong id="path-panel-title">Path mode</strong>
      <button id="path-panel-close" class="icon-btn node-panel-close" aria-label="Exit path mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.88 18.29 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.3-6.3z"/></svg>
      </button>
    </div>
    <div id="path-panel-body" class="muted">Click a node to set the start.</div>
  </div>
  <div id="empty-graph" hidden>
    <p id="empty-message" role="status">No matching pages</p>
    <button class="secondary" id="empty-clear">Clear filters</button>
  </div>
</main>

<script src="config.js"></script>
<script src="app.js?v=__BUILD_ID__" type="module"></script>
</body>
</html>
