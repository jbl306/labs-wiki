<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101d21" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Knowledge graph · Labs Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101d21'/%3E%3Cpath d='M6 23 15 6l11 17H6M15 6l2 20' stroke='%2389dbbf' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=__BUILD_ID__" />
<link rel="modulepreload" href="app.js?v=__BUILD_ID__" />
<link rel="modulepreload" href="interaction-targets.js?v=__BUILD_ID__" />
<link rel="modulepreload" href="markdown.js?v=__BUILD_ID__" />
<link rel="modulepreload" href="pointer-gesture.js?v=__BUILD_ID__" />
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-network" viewBox="0 0 24 24"><path d="m5 17 6-11 8 11H5Zm6-11 1 14"/><circle cx="5" cy="17" r="2.3"/><circle cx="11" cy="5" r="2.5"/><circle cx="19" cy="17" r="2.3"/><circle cx="12" cy="20" r="1.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 7h8m5 0h5M3 17h3m5 0h10"/><circle cx="13" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/><path d="M8 8h8m-8 4h5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 4v5h-5M4 20v-5h5"/><path d="M4.8 9a7.5 7.5 0 0 1 12.5-4L20 9M4 15l2.7 4A7.5 7.5 0 0 0 19.2 15"/></symbol>
  <symbol id="i-path" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h7.5"/></symbol>
  <symbol id="i-health" viewBox="0 0 24 24"><path d="M2 12h5l3-7 4 14 3-7h5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 5v7a2 2 0 0 1-2 2H5m5-5-5 5 5 5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9l-6-6zM13 3v6h6M9 13h6m-6 4h4"/></symbol>
</svg>
<header class="masthead">
  <div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-network"/></svg></span>Labs Wiki</div>
  <div class="sync-controls">
    <span id="connection-state" role="status" data-state="loading">Connecting</span>
    <button id="rebuild-btn" class="icon-btn" title="Reload graph" aria-label="Reload graph"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
  </div>
</header>
<div id="sidebar-backdrop" hidden></div>
<aside id="sidebar" aria-labelledby="explore-title">
  <div class="sidebar-heading">
    <h2 id="explore-title">Explore</h2>
    <button id="sidebar-close" class="icon-btn" aria-label="Close controls"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <section class="page-search">
    <label for="search">Search pages</label>
    <div class="search-field"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Title or tag" autocomplete="off" /></div>
    <div id="search-meta" role="status" class="muted"></div>
    <ul id="search-results" class="result-list" aria-label="Matching pages" hidden></ul>
  </section>
  <div class="disclosures">
    <details id="ask-controls">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-ask"/></svg><span>Ask the graph</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
      <form id="ask-form" class="ask-field">
        <label class="sr-only" for="ask-graph">Ask the graph</label>
        <input id="ask-graph" type="search" placeholder="Ask a question…" autocomplete="off" />
        <button class="icon-btn" aria-label="Submit question" title="Submit question"><svg class="icon" aria-hidden="true"><use href="#i-enter"/></svg></button>
      </form>
      <div id="ask-results" class="hidden">
        <div class="muted" id="ask-meta" role="status"></div>
        <ol id="ask-results-list" class="result-list" aria-label="Ask results"></ol>
      </div>
      <button id="ask-graph-clear" class="secondary hidden" type="button">Clear answer</button>
    </details>
    <details id="advanced-controls">
      <summary><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span>Filters and display</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary>
      <div class="filter-controls">
        <label>Type<select id="type-filter"><option value="">All types</option></select></label>
        <label>Community<select id="community-filter"><option value="">All communities</option></select></label>
        <label>Tier<select id="tier-filter"><option value="">All tiers</option></select></label>
        <label>Checkpoint class<select id="checkpoint-class-filter"><option value="">All classes</option></select></label>
        <label class="check"><input type="checkbox" id="stale-only-toggle" /> Stale only (unverified or over 90 days)</label>
        <label class="check"><input type="checkbox" id="archive-toggle" /> Include archived pages</label>
        <label class="check"><input type="checkbox" id="surprises-toggle" /> Highlight cross-community edges</label>
        <button id="clear-filters" class="secondary" type="button">Clear filters</button>
      </div>
    </details>
  </div>
  <section id="checkpoint-detail" class="hidden">
    <h3>Checkpoint disagreement</h3>
    <div id="checkpoint-detail-body" class="muted"></div>
  </section>
  <section id="legend" aria-label="Graph legend"></section>
  <footer id="build-time"></footer>
</aside>
<main id="canvas-host" aria-labelledby="graph-title">
  <header class="graph-heading">
    <div>
      <h1 id="graph-title">Knowledge graph</h1>
      <div class="graph-scope">
        <p id="stats">
          <span><b id="stat-pages">—</b> <span>pages</span></span>
          <span><b id="stat-edges">—</b> <span>edges</span></span>
          <span><b id="stat-communities">—</b> <span>communities</span></span>
        </p>
        <button id="scope-clear" hidden>Clear filters</button>
      </div>
    </div>
    <button id="sidebar-toggle" aria-label="Search and graph controls" aria-controls="sidebar" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg> Explore</button>
  </header>
  <div id="graph-stage">
    <canvas id="graph" aria-label="Page connections"></canvas>
    <div id="graph-cosmos" hidden></div>
    <div class="map-tools">
      <div id="mode-controls" class="dock" role="group" aria-label="Graph modes">
        <button id="path-mode-toggle" aria-pressed="false" title="Trace a path between pages"><svg class="icon" aria-hidden="true"><use href="#i-path"/></svg> Path</button>
        <button id="checkpoint-health-toggle" aria-pressed="false" title="Checkpoint health"><svg class="icon" aria-hidden="true"><use href="#i-health"/></svg> Health</button>
      </div>
      <div id="view-controls" class="dock" role="group" aria-label="Graph view controls">
        <button id="zoom-out" class="icon-btn" aria-label="Zoom out" title="Zoom out"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <output id="zoom-level" aria-label="Zoom level" aria-live="off">—</output>
        <button id="zoom-in" class="icon-btn" aria-label="Zoom in" title="Zoom in"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="zoom-fit" class="icon-btn" aria-label="Fit graph to viewport" title="Fit graph to viewport"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
    </div>
    <section id="path-panel" class="hidden" aria-live="polite">
      <div class="panel-heading"><strong id="path-panel-title">Path mode</strong>
        <button id="path-panel-close" class="icon-btn" aria-label="Exit path mode"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div id="path-panel-body">Select a starting page.</div>
    </section>
    <div id="empty-graph" hidden>
      <p id="empty-message" role="status">No matching pages</p>
      <button class="secondary" id="empty-clear">Clear filters</button>
    </div>
  </div>
</main>
<section id="node-panel" aria-labelledby="node-title" class="hidden">
  <header class="reader-bar"><span><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg> Wiki page</span><button id="node-panel-close" class="icon-btn" aria-label="Close node details"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header>
  <div class="reader-body">
    <h2 id="node-title" tabindex="-1"></h2>
    <div class="muted" id="node-meta"></div>
    <p id="node-summary"></p>
    <div id="node-content" class="node-content"></div>
    <h3>Neighbors</h3>
    <ul id="node-neighbors" class="result-list"></ul>
  </div>
</section>
<script src="config.js"></script>
<script src="app.js?v=__BUILD_ID__" type="module"></script>
</body>
</html>
